name: CI iOS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validacion de estructura iOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar proyecto Xcode y fuentes Swift
        run: |
          test -d PucePark.xcodeproj
          echo "Archivos Swift:"
          find PucePark -name '*.swift' | wc -l
